<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Signature du document</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" id="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-6 5-9 7-9s-1 9 2 9 3-5 5-5 2 3 4 3"/><path d="M3 21h18"/></svg></div>
    <div class="brand"><h1 id="company">Signature électronique</h1><p id="subtitle">Chargement du document…</p></div>
  </header>
  <main id="app" class="stack"></main>
  <footer>Signature électronique au sens du règlement (UE) n° 910/2014 (eIDAS). La date, l'heure et l'adresse de connexion sont enregistrées par le serveur au moment de la signature, avec l'empreinte du document.</footer>
</div>
<script src="/vendor/pdf-lib.min.js"></script>
<script src="/vendor/pdf.min.js"></script>
<script src="/vendor/seal.js"></script>
<script src="/common.js"></script>
<script>
const token = location.pathname.split("/").filter(Boolean)[1] || "";
const app = $("#app");
const consentText = docs => docs.length > 1
  ? `J'ai lu en entier les ${docs.length} documents suivants : ${docs.map(d => "« " + d.name + " »").join(", ")}. J'accepte de les signer électroniquement. Ma signature a la même valeur d'engagement que ma signature manuscrite.`
  : "J'ai lu le document en entier et j'accepte de le signer électroniquement. Ma signature a la même valeur d'engagement que ma signature manuscrite.";
const startedAt = Date.now();
let info = null, pdfBuf = null;

async function api(path, opts = {}) {
  const r = await fetch(`/api/s/${token}${path}`, opts);
  const ct = r.headers.get("content-type") || "";
  if (!r.ok) throw new Error(ct.includes("json") ? (await r.json()).error : "Erreur de connexion.");
  return ct.includes("json") ? r.json() : r.arrayBuffer();
}

function header() {
  const p = info.profile;
  if (p.company) { $("#company").textContent = p.company; document.title = "Signer · " + p.company; }
  if (p.color) document.documentElement.style.setProperty("--accent", p.color);
  if (p.hasLogo) $("#logo").replaceChildren(h("img", {src: "/api/logo", alt: ""}));
  $("#subtitle").textContent = info.title;
}

function finalView() {
  app.replaceChildren(h("section", {class: "panel done"},
    h("div", {class: "big-ok"}, "Document signé par tous"),
    h("p", {style: "margin:0"}, `« ${info.title} » est finalisé et scellé. Télécharge ta copie et garde-la.`),
    h("button", {class: "btn", type: "button", onclick: async e => { e.target.disabled = true; try { download(info.fileName.replace(/\.pdf$/i, "") + "-signe.pdf", await api("/pdf")); } finally { e.target.disabled = false; } }}, "Télécharger le document signé"),
    info.finalHash ? h("p", {class: "hash"}, "Empreinte SHA-256 : " + info.finalHash) : null));
}
function signedView() {
  const onsite = info.signer.onsite;
  app.replaceChildren(h("section", {class: "panel done"},
    h("div", {class: "big-ok"}, "Merci, c'est signé"),
    h("p", {style: "margin:0"}, onsite
      ? `Ta signature a été enregistrée le ${fmtDate(info.signer.signedAt)}. Tu peux rendre l'appareil à l'accueil.`
      : `Ta signature a été enregistrée le ${fmtDate(info.signer.signedAt)}. Quand tout le monde aura signé, tu recevras le document final par email. Il restera aussi disponible à cette même adresse.`)));
}
function declinedView() {
  app.replaceChildren(h("section", {class: "panel done"},
    h("h2", {}, "Refus enregistré"),
    h("p", {style: "margin:0"}, `Ton refus a été enregistré le ${fmtDate(info.signer.declinedAt)} et transmis à ${info.profile.company || "l'expéditeur"}. Le document ne sera pas signé.`)));
}

async function signView() {
  const me = info.signer, zones = me.placements, docs = info.documents || [], CONSENT = consentText(docs);
  const seen = new Set();
  const where = h("p", {class: "lbl", style: "margin:0;font-weight:600"});
  const docOf = n => docs.find(d => n >= d.from && n <= d.to);
  const viewer = makeViewer({onRender: v => {
    seen.add(v.n);
    const d = docOf(v.n); where.textContent = d ? `Document ${docs.indexOf(d) + 1} / ${docs.length} : ${d.name} · page ${v.n - d.from + 1} / ${d.to - d.from + 1}` : "";
    v.overlay.replaceChildren(...zones.filter(z => z.page === v.n).map(z => h("div", {class: "zone mine", style: v.boxStyle(z)}, "Signe ici")));
    progress();
  }});
  const readNote = h("p", {class: "note"});
  const nameIn = h("input", {type: "text", id: "fullName", value: me.name || "", autocomplete: "name"});
  const idIn = h("input", {type: "text", id: "idNum", placeholder: "DNI, NIE ou passeport", autocomplete: "off"});
  const consent = h("input", {type: "checkbox", id: "consent"});
  let consentAt = null;
  consent.onchange = () => { consentAt = consent.checked ? new Date().toISOString() : null; ready(); };
  const pad = signaturePad({nameHint: () => nameIn.value});
  pad.onchange = ready;
  const go = h("button", {class: "btn", type: "button", disabled: true}, "Signer le document");
  // vérification d'identité par code envoyé à l'email du signataire
  const codeIn = h("input", {type: "text", id: "otp", inputmode: "numeric", autocomplete: "one-time-code", maxlength: "6", placeholder: "6 chiffres", style: "max-width:160px;letter-spacing:4px;font-family:var(--mono)"});
  const codeSt = h("div", {class: "status", role: "status", "aria-live": "polite"});
  const sendBtn = h("button", {class: "btn ghost small", type: "button"}, "Recevoir mon code par email");
  sendBtn.onclick = async () => {
    sendBtn.disabled = true; setStatus(codeSt, "Envoi du code…");
    try { const r = await api("/code", {method: "POST"}); setStatus(codeSt, `Code envoyé à ${r.sentTo}. Pense à regarder tes spams.`, "ok"); sendBtn.textContent = "Renvoyer un code"; codeIn.focus(); }
    catch (e) { setStatus(codeSt, e.message, "err"); }
    setTimeout(() => sendBtn.disabled = false, 45000);
  };
  codeIn.oninput = () => { codeIn.value = codeIn.value.replace(/\D/g, "").slice(0, 6); ready(); };
  const codeBox = me.requiresCode ? h("div", {class: "field", style: "gap:8px"},
    h("label", {for: "otp"}, `Pour confirmer que c'est bien toi, reçois un code à ${me.emailMasked} et saisis-le ici.`),
    h("div", {class: "row"}, sendBtn, codeIn), codeSt) : null;
  const st = h("div", {class: "status", role: "status", "aria-live": "polite"});
  // refuser de signer, avec un motif
  const reasonIn = h("textarea", {id: "reason", placeholder: "Ex. : une clause ne correspond pas à ce qui était convenu", style: "min-height:80px;font-family:var(--body)"});
  const declineSt = h("div", {class: "status", role: "status", "aria-live": "polite"});
  const declineBox = h("div", {class: "field", style: "gap:8px", hidden: true},
    h("label", {for: "reason"}, "Pourquoi refuses-tu de signer ? Ton message est transmis à l'expéditeur."), reasonIn,
    h("div", {class: "row"}, h("button", {class: "btn danger", type: "button", onclick: async e => {
      if (!reasonIn.value.trim()) return setStatus(declineSt, "Indique en quelques mots la raison du refus.", "err");
      e.target.disabled = true;
      try { const r = await api("/decline", {method: "POST", body: JSON.stringify({reason: reasonIn.value.trim()})}); info.signer.declinedAt = r.declinedAt; declinedView(); }
      catch (er) { setStatus(declineSt, er.message, "err"); e.target.disabled = false; }
    }}, "Confirmer le refus"), h("button", {class: "btn ghost small", type: "button", onclick: () => declineBox.hidden = true}, "Annuler")), declineSt);
  const declinePanel = h("section", {class: "panel"}, h("div", {class: "row"}, h("span", {style: "flex:1;color:var(--muted);font-size:.9rem"}, "Tu n'es pas d'accord avec le document ?"),
    h("button", {class: "btn ghost small", type: "button", onclick: () => { declineBox.hidden = false; reasonIn.focus(); }}, "Je refuse de signer")), declineBox);
  // signer avec son certificat électronique (DNIe, FNMT) via AutoFirma
  const certFile = h("input", {type: "file", accept: "application/pdf,.pdf", id: "certPdf"});
  const certSt = h("div", {class: "status", role: "status", "aria-live": "polite"});
  const certConsent = h("input", {type: "checkbox", id: "certConsent"});
  let certConsentAt = null, certBytes = null, certResult = null;
  certConsent.onchange = () => { certConsentAt = certConsent.checked ? new Date().toISOString() : null; certReady(); };
  const certGo = h("button", {class: "btn", type: "button", disabled: true}, "Envoyer le document signé");
  const certReady = () => certGo.disabled = !(certResult?.valid && certConsent.checked);
  certFile.onchange = async () => {
    certResult = null; certReady(); const f = certFile.files[0]; if (!f) return;
    setStatus(certSt, "Vérification de la signature…");
    try {
      certBytes = new Uint8Array(await f.arrayBuffer());
      if (certBytes.length <= pdfBuf.byteLength || await hex256(certBytes.slice(0, pdfBuf.byteLength).buffer) !== info.originalHash) return setStatus(certSt, "Ce PDF n'est pas le document envoyé, ou il a été modifié avant d'être signé. Signe le fichier téléchargé ici, sans le modifier.", "err");
      certResult = await Seal.verifyPades(certBytes);
      if (!certResult.valid) return setStatus(certSt, certResult.reason || "La signature n'a pas pu être vérifiée.", "err");
      if (!certResult.coversWholeFile) return setStatus(certSt, "Le fichier a été modifié après la signature.", "err");
      setStatus(certSt, `Signature valide : ${certResult.name}${certResult.idNumber ? " (" + certResult.idNumber + ")" : ""}, certificat émis par ${certResult.issuer}.`, "ok");
    } catch { setStatus(certSt, "Ce fichier n'a pas pu être lu.", "err"); }
    certReady();
  };
  certGo.onclick = async () => {
    certGo.disabled = true; setStatus(certSt, "Envoi du document signé…");
    try {
      await api("/viewed", {method: "POST", body: JSON.stringify({pages: viewer.count, seconds: Math.round((Date.now() - startedAt) / 1000)})}).catch(() => {});
      const meta = {consent: true, consentText: CONSENT, consentAt: certConsentAt, cert: certResult};
      const r = await api("/sign-cert", {method: "POST", headers: {"content-type": "application/pdf", "x-meta": encodeURIComponent(JSON.stringify(meta))}, body: certBytes});
      info.signer.signedAt = r.signedAt; signedView();
    } catch (e) { setStatus(certSt, e.message, "err"); certReady(); }
  };
  const certPanel = me.onsite ? null : h("details", {class: "panel"}, h("summary", {style: "cursor:pointer;font-weight:600"}, "Signer avec mon certificat électronique (DNIe, FNMT)"),
    h("div", {class: "stack", style: "gap:10px;margin-top:10px"},
      h("p", {class: "note"}, "Signature la plus forte en Espagne. Il te faut un ordinateur avec l'application gratuite AutoFirma et ton certificat (DNIe avec lecteur, ou certificat FNMT installé)."),
      h("ol", {style: "margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"},
        h("li", {}, h("button", {class: "btn ghost small", type: "button", onclick: () => download(info.fileName, pdfBuf)}, "Télécharger le document"), " sans le modifier."),
        h("li", {}, "Ouvre-le dans ", h("a", {href: "https://firmaelectronica.gob.es/Home/Descargas.html", target: "_blank", rel: "noopener"}, "AutoFirma"), " et signe-le avec ton certificat (format PDF)."),
        h("li", {}, h("label", {for: "certPdf"}, "Envoie ici le fichier signé : "), certFile)),
      certSt,
      h("label", {class: "check", for: "certConsent"}, certConsent, h("span", {}, CONSENT)),
      h("div", {class: "row"}, certGo)));
  const form = h("section", {class: "panel"},
    h("h2", {}, "2. Ta signature"),
    docs.length > 1 ? h("p", {class: "note"}, "Une seule signature suffit : elle sera apposée sur chacun des documents.") : null,
    h("div", {class: "fields"}, h("div", {class: "field"}, h("label", {for: "fullName"}, "Nom complet"), nameIn), h("div", {class: "field"}, h("label", {for: "idNum"}, "Pièce d'identité (conseillé)"), idIn)),
    pad.el,
    h("label", {class: "check", for: "consent"}, consent, h("span", {}, CONSENT)),
    codeBox, h("div", {class: "row"}, go), st);
  function progress() {
    const left = viewer.count - seen.size;
    readNote.textContent = left > 0 ? `Lis toutes les pages avant de signer : encore ${left} page${left > 1 ? "s" : ""} à voir. Utilise les flèches.` : (docs.length > 1 ? "Tu as vu toutes les pages des documents. Tu peux signer en bas." : "Tu as vu toutes les pages. Tu peux signer en bas.");
    ready();
  }
  function ready() { go.disabled = !(viewer.count && seen.size >= viewer.count && nameIn.value.trim() && consent.checked && pad.png && (!me.requiresCode || codeIn.value.length === 6)); }
  nameIn.oninput = ready;
  go.onclick = async () => {
    go.disabled = true; setStatus(st, "Enregistrement de ta signature…");
    try {
      await api("/viewed", {method: "POST", body: JSON.stringify({pages: seen.size, seconds: Math.round((Date.now() - startedAt) / 1000)})}).catch(() => {});
      const r = await api("/sign", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({
        name: nameIn.value.trim(), idNumber: idIn.value.trim(), consent: true, consentText: CONSENT, consentAt, method: pad.method, signature: pad.png, documentHash: info.originalHash, code: codeIn.value})});
      info.signer.signedAt = r.signedAt; signedView();
    } catch (e) { setStatus(st, e.message || "La signature n'a pas pu être enregistrée.", "err"); go.disabled = false; }
  };
  app.replaceChildren(
    h("section", {class: "panel"},
      h("h2", {}, `Bonjour ${me.name || ""}`),
      h("p", {style: "margin:0"}, `${info.profile.company || "On"} te demande de signer « ${info.title} »${me.role ? " en tant que " + me.role.toLowerCase() : ""}. Ça prend une minute.`),
      docs.length > 1 ? h("div", {class: "field"}, h("span", {class: "lbl"}, `${docs.length} documents à lire et signer :`), h("ul", {class: "timeline"}, docs.map((d, i) => h("li", {}, h("button", {class: "btn ghost small", type: "button", onclick: () => viewer.go(d.from)}, `${i + 1}. ${d.name}`))))) : null,
      h("h2", {}, docs.length > 1 ? "1. Lis les documents" : "1. Lis le document"), readNote, where, viewer.el,
      h("div", {class: "row"}, h("button", {class: "btn ghost small", type: "button", onclick: () => download(info.fileName, pdfBuf)}, "Télécharger pour lire"))),
    form, certPanel, declinePanel);
  await viewer.load(await openPdf(pdfBuf));
  const first = zones[0]?.page; if (first && first !== 1 && viewer.count === 1) await viewer.go(first);
}

(async () => {
  try {
    info = await api("");
    header();
    if (info.status === "final") return finalView();
    if (info.signer.status === "signed") return signedView();
    if (info.signer.status === "declined") return declinedView();
    pdfBuf = await api("/pdf");
    const hash = await hex256(pdfBuf);
    if (hash !== info.originalHash) throw new Error("Le document reçu ne correspond pas à l'original. Recharge la page.");
    await signView();
  } catch (e) {
    $("#subtitle").textContent = "";
    app.replaceChildren(h("section", {class: "panel"}, h("h2", {}, "Lien indisponible"), h("p", {style: "margin:0"}, e.message || "Ce lien de signature n'existe pas ou a expiré. Demande un nouveau lien à l'expéditeur.")));
  }
})();
</script>
</body>
</html>
