name = "signature"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/s/*", "/m/*"]

[[d1_databases]]
binding = "DB"
database_name = "signature"
database_id = "REMPLACER_PAR_ID_D1"

[[kv_namespaces]]
binding = "FILES"
id = "REMPLACER_PAR_ID_KV"

# Relances automatiques des signataires, chaque matin (heure UTC)
[triggers]
crons = ["17 8 * * *"]
