<style>
/* Layout: a workbench. Tool shelf grouped by job, one tool open at a time, page preview as the work surface. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e8ecf2; --line:#d3d9e3;
  --ink:#141a26; --muted:#5a6578; --accent:#2340c9; --on-accent:#ffffff;
  --mark:#ffe14d; --danger:#b42318; --ok:#127a48;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --surface:#171c27; --sunk:#1f2633; --line:#2c3545;
  --ink:#e8ecf3; --muted:#9aa5b8; --accent:#8ea2ff; --on-accent:#0b1020;
  --mark:#ffd84a; --danger:#ff8a80; --ok:#5fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --sunk:#1f2633; --line:#2c3545;
  --ink:#e8ecf3; --muted:#9aa5b8; --accent:#8ea2ff; --on-accent:#0b1020;
  --mark:#ffd84a; --danger:#ff8a80; --ok:#5fd39a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.logo{width:38px;height:38px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.privacy{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:0;text-wrap:balance}
.group{margin-bottom:22px}
.group h3{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tool{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:inherit;font:inherit;cursor:pointer;text-decoration:none;transition:border-color .15s,transform .15s}
.tool:hover{border-color:var(--accent);transform:translateY(-1px)}
.tool:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,label.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.tool .ic{width:34px;height:34px;flex:none;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--accent)}
.tool .ic svg{width:18px;height:18px}
.tool b{display:block;font-weight:600}
.tool span{color:var(--muted);font-size:.85rem;line-height:1.35}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
.panel-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.panel-head p{margin:2px 0 0;color:var(--muted)}
.back{background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit;padding:6px 10px;cursor:pointer}
label.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;cursor:pointer;background:var(--sunk)}
label.drop.over{border-color:var(--accent)}
label.drop input{position:absolute;width:1px;height:1px;opacity:0}
label.drop b{font-weight:600}
label.drop small{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:180px;font-family:var(--mono);font-size:.85rem}
input[type=range]{accent-color:var(--accent)}
button.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn.small{padding:6px 10px;font-size:.85rem;font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--ink);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.status.err{color:var(--danger)}
.status.ok{color:var(--ok)}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.files li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files li .meta{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:.9rem;display:grid;place-items:center;flex:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.thumb{background:var(--sunk);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.thumb .pg{width:100%;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden}
.thumb canvas{max-width:100%;max-height:100%;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .2s}
.thumb .n{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.thumb .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.thumb.removed{opacity:.35}
.viewer{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage-wrap{background:var(--sunk);border-radius:var(--r);padding:12px;overflow:auto;display:flex;justify-content:center}
.stage{position:relative;line-height:0;box-shadow:0 2px 10px rgba(0,0,0,.18);touch-action:none}
.stage canvas{display:block}
.overlay{position:absolute;inset:0;line-height:1.2}
.overlay .tx{position:absolute;border-radius:2px;cursor:text}
.overlay.mode-edit .tx:hover{outline:1.5px solid var(--accent);background:rgba(35,64,201,.08)}
.overlay .op{position:absolute;pointer-events:none;white-space:pre;color:#000;font-family:Helvetica,Arial,sans-serif}
.overlay .op.white{background:#fff}
.overlay .op.hl{background:rgba(255,225,77,.45)}
.overlay .op.box{background:#000}
.overlay .op img{width:100%;height:100%}
.overlay input.inline{position:absolute;font-family:Helvetica,Arial,sans-serif;padding:0 2px;border:1.5px solid var(--accent);border-radius:2px;background:#fff;color:#000;line-height:1}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;font-family:var(--mono);font-size:.85rem}
.sigpad{width:100%;max-width:520px;height:170px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--mark);padding:4px 0 4px 10px;margin:0;max-width:70ch}
.result{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;border-radius:var(--r);background:var(--sunk)}
.result .sz{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.ops{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.ops div{display:flex;gap:8px;align-items:center}
.ops div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
footer{margin-top:32px;color:var(--muted);font-size:.8rem;max-width:70ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 15l2 2 4-5"/></svg></div>
    <div class="brand"><h1 id="brandName">Atelier PDF</h1><p>Tous tes outils PDF, sans abonnement.</p></div>

<script>
"use strict";
const {PDFDocument, rgb, degrees, StandardFonts, PDFTextField, PDFCheckBox, PDFDropdown, PDFRadioGroup, PDFOptionList} = PDFLib;
const app = document.getElementById("app");

/* ---------- small helpers ---------- */
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const fmtSize = n => n < 1024 ? n + " o" : n < 1048576 ? (n / 1024).toFixed(0) + " Ko" : (n / 1048576).toFixed(1) + " Mo";
const baseName = n => (n || "document").replace(/\.[^.]+$/, "");
const readBuf = f => f.arrayBuffer();
const sleep = ms => new Promise(r => setTimeout(r, ms));
let uid = 0; const nid = p => p + (++uid);

/* WinAnsi-safe text for the standard PDF fonts */
const EXTRA = "€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ";
const safe = s => Array.from(String(s)).map(c => {
  const cp = c.codePointAt(0);
  if (c === "\t") return "    ";
  if ((cp >= 32 && cp < 127) || (cp >= 160 && cp < 256) || EXTRA.includes(c)) return c;
  if (c === "’" || c === "‘") return "'";
  if (cp === 8239 || cp === 8201 || cp === 8202) return " ";
  return "";
}).join("");

/* pdf.js runs on the main thread (worker script loaded as a plain script) */
async function openJs(buf) { return pdfjsLib.getDocument({data: new Uint8Array(buf.slice(0)), isEvalSupported: false}).promise; }
async function renderToCanvas(pdf, n, scale) {
  const page = await pdf.getPage(n);
  const vp = page.getViewport({scale});
  const c = document.createElement("canvas");
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  return {canvas: c, viewport: vp, page};
}
const canvasBytes = (c, type = "image/png", q) => new Promise((res, rej) => c.toBlob(b => b ? b.arrayBuffer().then(res, rej) : rej(new Error("image")), type, q));
const canvasBlob = (c, type = "image/png", q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("image")), type, q));

/* ---------- saving: the frame cannot download by itself ---------- */
let downloadsP = null;
const getDownloads = () => downloadsP ??= (window.claude?.use ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null));
async function saveFile(filename, data, statusEl) {
  if (!window.claude?.use) { // page hébergée sur ton propre site : téléchargement classique
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000); setStatus(statusEl, "Enregistré : " + filename, "ok"); return;
  }
  const d = await getDownloads();
  if (!d) { setStatus(statusEl, "L'enregistrement n'est pas disponible dans cette vue. Ouvre la page dans claude.ai.", "err"); return; }
  try {
    await d.save({filename, data: data instanceof Blob ? data : new Blob([data])});
    setStatus(statusEl, "Enregistré : " + filename, "ok");
  } catch (e) {
    const msg = {declined: "Enregistrement annulé.", rate_limited: "Une demande est déjà ouverte. Réessaie dans un instant.", too_large: "Fichier trop gros pour cette vue."}[e?.code] || "Enregistrement impossible ici.";
    setStatus(statusEl, msg, "err");
  }
}
function setStatus(el, msg, kind) { if (!el) return; el.textContent = msg || ""; el.className = "status" + (kind ? " " + kind : ""); }
function resultBox(filename, bytes, statusEl, extra) {
  const size = bytes.byteLength ?? bytes.size;
  return h("div", {class: "result"},
    h("button", {class: "btn", onclick: () => saveFile(filename, bytes, statusEl)}, "Enregistrer " + filename.split(".").pop().toUpperCase()),
    h("span", {class: "sz"}, filename + " · " + fmtSize(size)), extra || null);
}

/* ---------- sample PDF so every tool can be tried at once ---------- */
async function samplePdf() {
  const doc = await PDFDocument.create();
  const f = await doc.embedFont(StandardFonts.Helvetica), fb = await doc.embedFont(StandardFonts.HelveticaBold);
  const lines = [
    ["Contrat de coaching", "Exemple — page 1", ["Entre le club et le membre, il est convenu ce qui suit.", "Durée : 3 mois, renouvelable.", "Séances : 2 par semaine, 60 minutes.", "Tarif : 89 € par mois, payable le 1er du mois."]],
    ["Programme d'entraînement", "Exemple — page 2", ["Lundi : force, bas du corps.", "Mercredi : cardio et mobilité.", "Vendredi : force, haut du corps.", "Objectif : progression mesurée toutes les 4 semaines."]],
    ["Fiche d'inscription", "Exemple — page 3", ["Nom :", "Email :", "J'accepte le règlement intérieur :"]]
  ];
  for (const [t, sub, body] of lines) {
    const p = doc.addPage([595.28, 841.89]);
    p.drawRectangle({x: 0, y: 781, width: 595.28, height: 61, color: rgb(.137, .251, .788)});
    p.drawText(safe(t), {x: 50, y: 804, size: 22, font: fb, color: rgb(1, 1, 1)});
    p.drawText(safe(sub), {x: 50, y: 750, size: 10, font: f, color: rgb(.4, .4, .45)});
    body.forEach((l, i) => p.drawText(safe(l), {x: 50, y: 710 - i * 26, size: 13, font: f}));
  }
  const p3 = doc.getPage(2), form = doc.getForm();
  const nom = form.createTextField("nom"); nom.addToPage(p3, {x: 120, y: 702, width: 300, height: 20});
  const em = form.createTextField("email"); em.addToPage(p3, {x: 120, y: 676, width: 300, height: 20});
  const ok = form.createCheckBox("reglement"); ok.addToPage(p3, {x: 290, y: 652, width: 16, height: 16});
  return doc.save();
}
async function sampleFile() { return new File([await samplePdf()], "exemple.pdf", {type: "application/pdf"}); }

/* ---------- shared UI pieces ---------- */
function dropZone({accept = "application/pdf,.pdf", multiple = false, label = "Choisis un PDF", hint = "ou glisse-le ici", onFiles, sample = true, capture}) {
  const id = nid("f");
  const input = h("input", {type: "file", id, accept, multiple, capture});
  const lab = h("label", {class: "drop", for: id}, input, h("b", {}, label), h("small", {}, hint));
  input.addEventListener("change", () => { if (input.files.length) onFiles([...input.files]); input.value = ""; });
  lab.addEventListener("dragover", e => { e.preventDefault(); lab.classList.add("over"); });
  lab.addEventListener("dragleave", () => lab.classList.remove("over"));
  lab.addEventListener("drop", e => { e.preventDefault(); lab.classList.remove("over"); if (e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); });
  const wrap = h("div", {class: "field"}, lab);
  if (sample) wrap.append(h("div", {class: "row"}, h("button", {class: "btn ghost small", type: "button", onclick: async () => onFiles([await sampleFile()])}, "Essayer avec un exemple")));
  return wrap;
}
function seg(options, value, onChange) {
  const el = h("div", {class: "seg", role: "group"});
  const set = v => { value = v; [...el.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); onChange(v); };
  for (const [v, l] of options) el.append(h("button", {type: "button", "data-v": v, "aria-pressed": v === value, onclick: () => set(v)}, l));
  return el;
}
const fieldBox = (label, control) => { const id = control.id || (control.id = nid("c")); return h("div", {class: "field"}, h("label", {for: id}, label), control); };

/* Page viewer used by sign / edit / watermark-free tools */
function makeViewer({onRender}) {
  const canvasHolder = h("div", {class: "stage"});
  const overlay = h("div", {class: "overlay"});
  const info = h("span", {}, "–");
  const prev = h("button", {class: "icon-btn", type: "button", "aria-label": "Page précédente"}, "‹");
  const next = h("button", {class: "icon-btn", type: "button", "aria-label": "Page suivante"}, "›");
  const stageWrap = h("div", {class: "stage-wrap"}, canvasHolder);
  const el = h("div", {class: "viewer"}, h("div", {class: "pager"}, prev, info, next), stageWrap);
  const v = {el, overlay, pdf: null, n: 1, count: 0, viewport: null, scale: 1};
  async function draw() {
    if (!v.pdf) return;
    const page = await v.pdf.getPage(v.n);
    const base = page.getViewport({scale: 1});
    const avail = Math.max(260, Math.min(stageWrap.clientWidth - 24, 820));
    v.scale = avail / base.width;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page.getViewport({scale: v.scale * dpr});
    const c = document.createElement("canvas");
    c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    c.style.width = Math.round(vp.width / dpr) + "px"; c.style.height = Math.round(vp.height / dpr) + "px";
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    v.viewport = page.getViewport({scale: v.scale}); v.page = page;
    canvasHolder.replaceChildren(c, overlay);
    info.textContent = `Page ${v.n} / ${v.count}`;
    prev.disabled = v.n <= 1; next.disabled = v.n >= v.count;
    await onRender?.(v);
  }
  prev.onclick = () => { if (v.n > 1) { v.n--; draw(); } };
  next.onclick = () => { if (v.n < v.count) { v.n++; draw(); } };
  v.load = async pdf => { v.pdf = pdf; v.count = pdf.numPages; v.n = 1; await draw(); };
  v.redraw = draw;
  v.toPdf = (x, y) => v.viewport.convertToPdfPoint(x, y);
  v.toView = (x, y) => v.viewport.convertToViewportPoint(x, y);
  v.point = e => { const r = overlay.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  return v;
}

/* ---------- tool registry ---------- */
const I = {
  merge: '<path d="M8 3v6a4 4 0 0 0 4 4h0a4 4 0 0 1 4 4v4"/><path d="M16 3v6a4 4 0 0 1-4 4"/><path d="M5 18l3 3 3-3"/>',
  pages: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/>',
  split: '<path d="M6 3v18"/><path d="M18 3v18"/><path d="M10 12h4"/><path d="M12 9l3 3-3 3"/>',
  zip: '<path d="M4 14l8 7 8-7"/><path d="M12 3v18"/><path d="M4 7h16"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  sign: '<path d="M3 17c3-6 5-9 7-9s-1 9 2 9 3-5 5-5 2 3 4 3"/><path d="M3 21h18"/>',
  form: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/>',

function toolMerge(body, st) {
  let files = [];

  const out = h("div");
  const draw = () => {
    list.replaceChildren(...files.map((f, i) => h("li", {},
      h("span", {class: "meta"}, String(i + 1).padStart(2, "0")), h("span", {class: "nm"}, f.name), h("span", {class: "meta"}, fmtSize(f.size)),
      h("button", {class: "icon-btn", type: "button", "aria-label": "Monter", disabled: i === 0, onclick: () => { [files[i - 1], files[i]] = [files[i], files[i - 1]]; draw(); }}, "↑"),
      h("button", {class: "icon-btn", type: "button", "aria-label": "Descendre", disabled: i === files.length - 1, onclick: () => { [files[i + 1], files[i]] = [files[i], files[i + 1]]; draw(); }}, "↓"),
      h("button", {class: "icon-btn", type: "button", "aria-label": "Retirer", onclick: () => { files.splice(i, 1); draw(); }}, "×"))));

/* =========================================================
   3. Découper
   ========================================================= */
function parseRanges(txt, max) {
  const out = [];
  for (const part of txt.split(/[,;\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:-(\d*))?$/);
    if (!m) throw new Error(part);
    const a = +m[1], b = m[2] === undefined ? a : (m[2] === "" ? max : +m[2]);
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) if (i >= 1 && i <= max) out.push(i - 1);
  }
  return out;
}
function toolSplit(body, st) {

        if (!idx.length) return setStatus(st, `Aucune page entre 1 et ${count}.`, "err");
        const d = await PDFDocument.create(); (await d.copyPages(s, idx)).forEach(p => d.addPage(p));

        out.replaceChildren(resultBox(`${name}-pages.zip`, await zip.generateAsync({type: "blob"}), st)); setStatus(st, `${count} fichiers dans un ZIP.`, "ok");
      }
    } catch { setStatus(st, "Le découpage a échoué.", "err"); }
  };
  body.append(dropZone({onFiles: async fs => {
    try { src = await readBuf(fs[0]); name = baseName(fs[0].name); count = (await PDFDocument.load(src, {ignoreEncryption: true})).getPageCount(); range.value = count > 1 ? `1-${Math.min(2, count)}` : "1"; go.disabled = false; setStatus(st, `${fs[0].name} : ${count} pages.`); }

/* =========================================================
   4. Compresser
   ========================================================= */
/* Allège seulement les images du PDF : le texte, les liens et les formulaires restent intacts. */
async function compressImages(buf, {maxDim, q}) {
  const {PDFName, PDFRawStream, PDFArray, PDFNumber, decodePDFRawStream} = PDFLib;
  const doc = await PDFDocument.load(buf, {ignoreEncryption: true, updateMetadata: false});
  const ctx = doc.context, N = k => PDFName.of(k);
  let done = 0, seen = 0;
  const nameOf = v => v instanceof PDFArray ? (v.size() === 1 ? v.get(0).toString() : "multi") : v ? v.toString() : "";
  const colorOk = cs => {
    const c = cs instanceof PDFArray ? null : cs;
    if (c) return ["/DeviceRGB", "/DeviceGray"].includes(c.toString());
    const arr = cs; if (!(arr instanceof PDFArray) || arr.get(0).toString() !== "/ICCBased") return false;
    const icc = ctx.lookup(arr.get(1)); const n = icc?.dict?.get(N("N")); return n && [1, 3].includes(n.asNumber());
  };
  for (const [ref, obj] of ctx.enumerateIndirectObjects()) {
    if (!(obj instanceof PDFRawStream) || obj.dict.get(N("Subtype"))?.toString() !== "/Image") continue;
    const d = obj.dict;
    if (d.get(N("ImageMask")) || d.get(N("Decode")) || d.get(N("SMaskInData"))) continue;
    const W = d.get(N("Width"))?.asNumber(), H = d.get(N("Height"))?.asNumber(), bpc = d.get(N("BitsPerComponent"))?.asNumber();
    const cs = ctx.lookup(d.get(N("ColorSpace")));
    if (!W || !H || W * H < 40000 || !colorOk(cs)) continue;
    seen++;
    const filter = nameOf(d.get(N("Filter")));
    let source;
    try {
      if (filter === "/DCTDecode") source = await createImageBitmap(new Blob([obj.contents], {type: "image/jpeg"}));
      else if (filter === "/FlateDecode" && bpc === 8 && !d.get(N("DecodeParms"))) {
        const raw = decodePDFRawStream(obj).decode(), comps = raw.length / (W * H);
        if (comps !== 1 && comps !== 3) continue;
        const id = new ImageData(W, H);
        for (let i = 0, j = 0; i < W * H; i++, j += comps) { const r = raw[j], g = comps === 3 ? raw[j + 1] : r, b = comps === 3 ? raw[j + 2] : r; id.data.set([r, g, b, 255], i * 4); }
        source = await createImageBitmap(id);
      } else continue;
    } catch { continue; }
    const k = Math.min(1, maxDim / Math.max(W, H)), w = Math.max(1, Math.round(W * k)), hh = Math.max(1, Math.round(H * k));
    const c = document.createElement("canvas"); c.width = w; c.height = hh;
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, hh); g.drawImage(source, 0, 0, w, hh);
    const jpg = new Uint8Array(await canvasBytes(c, "image/jpeg", q));
    c.width = c.height = 0;
    if (jpg.length >= obj.contents.length * .9) continue;
    const nd = d.clone(ctx);
    nd.set(N("Filter"), N("DCTDecode")); nd.set(N("Width"), PDFNumber.of(w)); nd.set(N("Height"), PDFNumber.of(hh));
    nd.set(N("BitsPerComponent"), PDFNumber.of(8)); nd.set(N("ColorSpace"), N("DeviceRGB")); nd.set(N("Length"), PDFNumber.of(jpg.length));
    nd.delete(N("DecodeParms"));
    ctx.assign(ref, PDFRawStream.of(nd, jpg));
    done++;
  }
  return {bytes: await doc.save({useObjectStreams: true}), done, seen};
}

function toolCompress(body, st) {
  let file = null, level = "moy", mode = "texte";
  const LV = {forte: {s: 1.1, q: .5, dim: 1200}, moy: {s: 1.5, q: .65, dim: 1800}, legere: {s: 2, q: .8, dim: 2600}};
  const go = h("button", {class: "btn", type: "button", disabled: true}, "Compresser");
  const out = h("div");
  const note = h("p", {class: "note"});
  const NOTES = {texte: "Les photos et images sont allégées. Le texte reste net et sélectionnable, et les formulaires restent remplissables.",
    image: "Chaque page devient une image : souvent le plus léger, mais le texte ne se sélectionne plus. À utiliser aussi pour effacer pour de bon ce que tu as masqué en noir dans « Modifier le texte »."};
  note.textContent = NOTES.texte;
  go.onclick = async () => {
    go.disabled = true; out.replaceChildren();
    try {
      const {s, q, dim} = LV[level], buf = await readBuf(file);
      let bytes, info = "";
      if (mode === "texte") {
        setStatus(st, "Allègement des images…");
        const r = await compressImages(buf, {maxDim: dim, q});
        bytes = r.bytes;
        info = r.seen ? ` ${r.done} image${r.done > 1 ? "s" : ""} allégée${r.done > 1 ? "s" : ""} sur ${r.seen}.` : " Ce PDF ne contient pas de grandes images.";
      } else {
        const js = await openJs(buf), doc = await PDFDocument.create();
        for (let n = 1; n <= js.numPages; n++) {
          setStatus(st, `Page ${n} / ${js.numPages}…`);
          const {canvas, page} = await renderToCanvas(js, n, s);
          const vp = page.getViewport({scale: 1});
          const img = await doc.embedJpg(await canvasBytes(canvas, "image/jpeg", q));
          doc.addPage([vp.width, vp.height]).drawImage(img, {x: 0, y: 0, width: vp.width, height: vp.height});
          canvas.width = canvas.height = 0;
        }
        bytes = await doc.save();
      }
      const gain = Math.round((1 - bytes.byteLength / file.size) * 100);
      if (gain <= 0) { setStatus(st, `Le fichier n'est pas plus léger.${info} Essaie le niveau « Forte »${mode === "texte" ? " ou le mode « Tout en images »" : ""}, ou garde l'original.`, "err"); go.disabled = false; return; }
      out.replaceChildren(resultBox(baseName(file.name) + "-compresse.pdf", bytes, st));
      setStatus(st, `${fmtSize(file.size)} → ${fmtSize(bytes.byteLength)} (−${gain} %).${info}`, "ok");
    } catch { setStatus(st, "La compression a échoué.", "err"); }
    go.disabled = false;
  };
  body.append(dropZone({onFiles: fs => { file = fs[0]; go.disabled = false; setStatus(st, `${file.name} · ${fmtSize(file.size)}`); }}),
    fieldBox("Méthode", seg([["texte", "Garder le texte"], ["image", "Tout en images"]], mode, v => { mode = v; note.textContent = NOTES[v]; })),
    fieldBox("Niveau", seg([["forte", "Forte"], ["moy", "Moyenne"], ["legere", "Légère"]], level, v => level = v)),
    note, h("div", {class: "row"}, go), out);
}

  async function renderOverlay(v) {

    if (mode === "edit") {
      const tc = await v.page.getTextContent();
      for (const it of tc.items) {
        if (!it.str || !it.str.trim()) continue;
        const [, , c, d, e, f] = it.transform; const fh = Math.hypot(c, d) || 10;
        const [vx, vy] = v.toView(e, f);
        const el = h("div", {class: "tx", style: `left:${vx}px;top:${vy - fh * s}px;width:${Math.max(it.width * s, 6)}px;height:${fh * s * 1.15}px`});
        el.addEventListener("click", ev => { ev.stopPropagation(); inlineInput({vx, vy: vy - fh * s, w: Math.max(it.width * s, 80), fh: fh * s, value: it.str, onDone: txt => {
          if (txt === it.str) return;

    const el = h("div", {class: "op" + (op.type === "replace" ? " white" : ""), style: `left:${vx}px;top:${vy - op.size * s}px;font-size:${op.size * s}px;line-height:1.15;color:${op.color}`}, op.text);

  }
  function inlineInput({vx, vy, w, fh, value, onDone}) {
    ov.querySelector("input.inline")?.remove();
    const inp = h("input", {class: "inline", type: "text", value, style: `left:${vx}px;top:${vy}px;width:${Math.min(w + 40, ov.clientWidth - vx)}px;height:${Math.max(fh * 1.3, 22)}px;font-size:${Math.max(fh, 12)}px`});

function toolImages(body, st) {
  let imgs = [], scan = true, fit = "a4";
  const list = h("ul", {class: "files"});
  const go = h("button", {class: "btn", type: "button", disabled: true}, "Créer le PDF");
  const out = h("div");

    list.replaceChildren(...imgs.map((f, i) => h("li", {}, h("span", {class: "meta"}, String(i + 1).padStart(2, "0")), h("span", {class: "nm"}, f.name), h("span", {class: "meta"}, fmtSize(f.size)),
      h("button", {class: "icon-btn", type: "button", "aria-label": "Monter", disabled: i === 0, onclick: () => { [imgs[i - 1], imgs[i]] = [imgs[i], imgs[i - 1]]; draw(); }}, "↑"),
      h("button", {class: "icon-btn", type: "button", "aria-label": "Retirer", onclick: () => { imgs.splice(i, 1); draw(); }}, "×"))));
    go.disabled = !imgs.length;
  };
  const add = fs => { imgs.push(...fs.filter(f => f.type.startsWith("image/"))); draw(); };
  async function toCanvas(file) {
    const bmp = await createImageBitmap(file, {imageOrientation: "from-image"}).catch(async () => { const im = new Image(); im.src = URL.createObjectURL(file); await im.decode(); return im; });
    const max = 2200, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext("2d"); g.drawImage(bmp, 0, 0, c.width, c.height);
    if (scan) { // grey + contrast stretch: paper turns white, ink turns dark
      const id = g.getImageData(0, 0, c.width, c.height), d = id.data, hist = new Uint32Array(256);
      for (let i = 0; i < d.length; i += 4) { const y = (d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114) | 0; d[i] = y; hist[y]++; }
      const tot = d.length / 4; let lo = 0, hi = 255, acc = 0;
      for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > tot * .02) { lo = v; break; } }
      acc = 0; for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > tot * .25) { hi = v; break; } }
      const span = Math.max(hi - lo, 30);
      for (let i = 0; i < d.length; i += 4) { const y = Math.max(0, Math.min(255, (d[i] - lo) * 255 / span)); d[i] = d[i + 1] = d[i + 2] = y; }
      g.putImageData(id, 0, 0);

  }

    go.disabled = true; out.replaceChildren();

        if (fit === "a4") {
          const land = c.width > c.height, W = land ? 841.89 : 595.28, H = land ? 595.28 : 841.89, m = 24;
          const k = Math.min((W - 2 * m) / c.width, (H - 2 * m) / c.height);
          doc.addPage([W, H]).drawImage(img, {x: (W - c.width * k) / 2, y: (H - c.height * k) / 2, width: c.width * k, height: c.height * k});
        } else { const k = 72 / 150; doc.addPage([c.width * k, c.height * k]).drawImage(img, {x: 0, y: 0, width: c.width * k, height: c.height * k}); }
      }
      out.replaceChildren(resultBox("scan.pdf", await doc.save(), st)); setStatus(st, `${imgs.length} pages créées.`, "ok");
    } catch { setStatus(st, "Une des images n'a pas pu être lue.", "err"); }
    go.disabled = false;
  };
  body.append(
    h("div", {class: "row"},
      dropZone({accept: "image/*", capture: "environment", label: "Prendre une photo", hint: "ouvre l'appareil photo sur téléphone", sample: false, onFiles: add}),
      dropZone({accept: "image/*", multiple: true, label: "Choisir des images", hint: "JPG, PNG, HEIC selon l'appareil", sample: false, onFiles: add})),
    list,
    h("div", {class: "row"}, h("label", {class: "check"}, (() => { const c = h("input", {type: "checkbox", checked: true}); c.onchange = () => scan = c.checked; return c; })(), "Effet scan (fond blanc, texte net)"),
      seg([["a4", "Format A4"], ["orig", "Taille de l'image"]], fit, v => fit = v)),

const xmlEsc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
async function makeDocx(paras) {
  // paras: [{text, size?, bold?, pageBreak?}]
  const body = paras.map(p => p.pageBreak ? '<w:p><w:r><w:br w:type="page"/></w:r></w:p>'
    : `<w:p><w:r>${p.bold || p.size ? `<w:rPr>${p.bold ? "<w:b/>" : ""}${p.size ? `<w:sz w:val="${Math.round(p.size * 2)}"/>` : ""}</w:rPr>` : ""}<w:t xml:space="preserve">${xmlEsc(p.text)}</w:t></w:r></w:p>`).join("");
  const zip = new JSZip();
  zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  return zip.generateAsync({type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
async function pdfToParas(js, onPage) {
  const paras = [];
  for (let n = 1; n <= js.numPages; n++) {
    onPage?.(n, js.numPages);
    const tc = await (await js.getPage(n)).getTextContent();
    const items = tc.items.filter(i => i.str !== undefined).map(i => ({s: i.str, x: i.transform[4], y: i.transform[5], h: Math.hypot(i.transform[2], i.transform[3]) || 10, w: i.width, eol: i.hasEOL}));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    for (const it of items) {
      const L = lines[lines.length - 1];
      if (L && Math.abs(L.y - it.y) < Math.max(L.h, it.h) * .5) { const gap = it.x - L.end; L.text += (gap > it.h * .2 && !L.text.endsWith(" ") && !it.s.startsWith(" ") ? " " : "") + it.s; L.end = it.x + it.w; L.h = Math.max(L.h, it.h); }
      else lines.push({y: it.y, h: it.h, text: it.s, end: it.x + it.w});
    }
    const hs = lines.map(l => l.h).sort((a, b) => a - b), med = hs[hs.length >> 1] || 11;
    let cur = null;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i], t = l.text.replace(/\s+/g, " ").trim(); if (!t) continue;
      const head = l.h > med * 1.25, prev = lines[i - 1];
      const gap = prev ? prev.y - l.y : 0;
      if (!cur || head || cur.head || gap > Math.max(l.h, prev.h) * 1.6) { cur = {text: t, head, size: head ? Math.round(l.h) : null, bold: head}; paras.push(cur); }
      else cur.text += (cur.text.endsWith("-") ? "" : " ") + t;
    }
    if (n < js.numPages) paras.push({pageBreak: true});
  }
  return paras;
}

/* =========================================================
   12. Word vers PDF
   ========================================================= */
async function blocksToPdf(blocks) {
  const doc = await PDFDocument.create();
  const F = {r: await doc.embedFont(StandardFonts.Helvetica), b: await doc.embedFont(StandardFonts.HelveticaBold)};
  const W = 595.28, H = 841.89, M = 56, maxW = W - 2 * M;
  let page = doc.addPage([W, H]), y = H - M;
  const newPage = () => { page = doc.addPage([W, H]); y = H - M; };
  for (const bl of blocks) {
    if (bl.pageBreak) { newPage(); continue; }
    const size = bl.size || 11, font = bl.bold ? F.b : F.r, lh = size * 1.4, indent = bl.bullet ? 14 : 0;
    const words = safe(bl.text).split(/\s+/).filter(Boolean); if (!words.length) { y -= lh * .6; continue; }
    const lines = []; let cur = "";
    for (const w of words) { const t = cur ? cur + " " + w : w; if (font.widthOfTextAtSize(t, size) > maxW - indent && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (cur) lines.push(cur);
    y -= bl.before || 0;
    lines.forEach((l, i) => {
      if (y - lh < M) newPage();
      if (i === 0 && bl.bullet) page.drawText(bl.bullet, {x: M, y: y - size, size, font: F.r});
      page.drawText(l, {x: M + indent, y: y - size, size, font, color: rgb(.08, .1, .15)});
      y -= lh;
    });
    y -= size * .5;
  }
  return doc.save();
}
function toolFromWord(body, st) {
  let file = null;
  const go = h("button", {class: "btn", type: "button", disabled: true}, "Convertir en PDF");
  const out = h("div");
  go.onclick = async () => {
    go.disabled = true; out.replaceChildren();
    try {
      let blocks = [];
      if (/\.txt$/i.test(file.name)) blocks = (await file.text()).split(/\n/).map(t => ({text: t}));
      else {
        const {value} = await mammoth.convertToHtml({arrayBuffer: await readBuf(file)});
        const dom = new DOMParser().parseFromString(value, "text/html");
        const SZ = {H1: 20, H2: 16, H3: 13.5, H4: 12, H5: 11, H6: 11};
        const walk = el => {
          for (const n of el.children) {
            if (SZ[n.tagName]) blocks.push({text: n.textContent, size: SZ[n.tagName], bold: true, before: 6});
            else if (n.tagName === "P") blocks.push({text: n.textContent});
            else if (n.tagName === "UL" || n.tagName === "OL") [...n.children].forEach((li, i) => blocks.push({text: li.textContent, bullet: n.tagName === "OL" ? `${i + 1}.` : "•"}));
            else if (n.tagName === "TABLE") n.querySelectorAll("tr").forEach(tr => blocks.push({text: [...tr.children].map(td => td.textContent.trim()).join("  |  ")}));
            else walk(n);
          }
        };
        walk(dom.body);
      }
      if (!blocks.some(b => b.text && b.text.trim())) { setStatus(st, "Ce document ne contient pas de texte lisible.", "err"); go.disabled = false; return; }
      out.replaceChildren(resultBox(baseName(file.name) + ".pdf", await blocksToPdf(blocks), st)); setStatus(st, "PDF créé.", "ok");
    } catch { setStatus(st, "Ce fichier n'a pas pu être lu. Le format .doc (ancien Word) n'est pas pris en charge : enregistre-le en .docx.", "err"); }
    go.disabled = false;
  };
  body.append(dropZone({accept: ".docx,.txt,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain", label: "Choisis un .docx ou .txt", sample: false, onFiles: fs => { file = fs[0]; go.disabled = false; setStatus(st, file.name); }}),
    h("p", {class: "note"}, "Titres, paragraphes, listes et tableaux (en texte) sont repris. Les images et les polices d'origine ne le sont pas."),
    h("div", {class: "row"}, go), out);
}

/* =========================================================
   13. Lire un scan (reconnaissance de texte sur l'appareil)
   ========================================================= */
let ocrWorker = null, ocrLang = "";
async function getOcr(lang, onProgress) {
  if (ocrWorker && ocrLang === lang) return ocrWorker;
  if (ocrWorker) { await ocrWorker.terminate(); ocrWorker = null; }
  const base = new URL("ocr/", location.href).href;
  ocrWorker = await Tesseract.createWorker(lang.split("+"), 1, {
    workerPath: base + "worker.js", corePath: base + "core", langPath: base + "lang",
    workerBlobURL: false, cacheMethod: "none",
    logger: m => onProgress?.(m)
  });
  ocrLang = lang;
  return ocrWorker;
}
/* Scan consultable : l'image de chaque page, avec le texte reconnu placé dessous, invisible, aux mêmes endroits. */
async function searchablePdf(pages) {
  const doc = await PDFDocument.create(), font = await doc.embedFont(StandardFonts.Helvetica);
  for (const pg of pages) {
    const W = pg.w / pg.k, H = pg.h / pg.k, page = doc.addPage([W, H]);
    page.drawImage(await doc.embedJpg(pg.jpg), {x: 0, y: 0, width: W, height: H});
    for (const w of pg.words) {
      const t = safe(w.t).trim(); if (!t) continue;
      const bw = (w.b.x1 - w.b.x0) / pg.k, bh = (w.b.y1 - w.b.y0) / pg.k, unit = font.widthOfTextAtSize(t, 1);
      if (bw <= 0 || bh <= 0 || !unit) continue;
      const size = Math.min(bw / unit, bh * 1.4);
      page.drawText(t, {x: w.b.x0 / pg.k, y: H - w.b.y1 / pg.k + bh * .15, size, font, opacity: 0});
    }
  }
  doc.setProducer("Atelier PDF");
  return doc.save();
}

function toolOcr(body, st) {
  let file = null, lang = "fra+spa", scanPages = [];
  const go = h("button", {class: "btn", type: "button", disabled: true}, "Lire le texte");
  const area = h("textarea", {id: "ocrText", placeholder: "Le texte reconnu apparaîtra ici. Tu peux le corriger avant de l'enregistrer."});
  const acts = h("div", {class: "row"}); acts.hidden = true;
  async function pagesOf(f) {
    if (f.type.startsWith("image/")) {
      const bmp = await createImageBitmap(f, {imageOrientation: "from-image"}); const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = bmp.width * k; c.height = bmp.height * k; c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      c.pxPerPt = Math.max(c.width / 595.28, c.height / 841.89, 1); // la photo tient dans une page A4
      return [c];
    }
    const js = await openJs(await readBuf(f)), out = [];
    for (let n = 1; n <= Math.min(js.numPages, 30); n++) { const {canvas} = await renderToCanvas(js, n, 2.2); canvas.pxPerPt = 2.2; out.push(canvas); }
    return out;
  }
  go.onclick = async () => {
    go.disabled = true; area.value = ""; acts.hidden = true;
    try {
      setStatus(st, "Préparation du moteur de lecture…");
      const pages = await pagesOf(file); let cur = 1;
      const w = await getOcr(lang, m => {
        if (m.status === "recognizing text") setStatus(st, `Lecture de la page ${cur} / ${pages.length} : ${Math.round(m.progress * 100)} %`);
        else if (/load|initializ/.test(m.status)) setStatus(st, "Préparation du moteur de lecture…");
      });
      const parts = []; scanPages = [];
      for (const [i, c] of pages.entries()) {
        cur = i + 1;
        const {data} = await w.recognize(c, {}, {text: true, blocks: true});
        parts.push(data.text.replace(/\n{3,}/g, "\n\n").trim()); area.value = parts.join("\n\n— — —\n\n");
        const words = (data.blocks || []).flatMap(b => b.paragraphs.flatMap(pa => pa.lines.flatMap(l => l.words)));
        scanPages.push({jpg: await canvasBytes(c, "image/jpeg", .8), w: c.width, h: c.height, k: c.pxPerPt, words: words.map(x => ({t: x.text, b: x.bbox}))});
        c.width = 0;
      }
      acts.hidden = false;
      setStatus(st, (pages.length > 1 ? `${pages.length} pages lues` : "Texte lu") + ". Relis-le : la reconnaissance peut se tromper sur les photos floues.", "ok");
    } catch (e) { setStatus(st, "La lecture a échoué. Essaie avec une photo plus nette, bien éclairée et prise bien à plat.", "err"); }
    go.disabled = false;
  };
  const copyBtn = h("button", {class: "btn ghost small", type: "button", onclick: async () => { try { await navigator.clipboard.writeText(area.value); setStatus(st, "Texte copié.", "ok"); } catch { area.select(); setStatus(st, "Sélectionné : copie-le avec ton appareil."); } }}, "Copier");
  acts.append(
    h("span", {style: "font-size:.85rem;color:var(--muted)"}, "Enregistrer :"),
    h("button", {class: "btn small", type: "button", onclick: async () => saveFile(baseName(file.name) + "-consultable.pdf", await searchablePdf(scanPages), st)}, "PDF consultable"),
    h("button", {class: "btn ghost small", type: "button", onclick: async () => saveFile(baseName(file.name) + "-texte.docx", await makeDocx(area.value.split(/\n{2,}/).map(t => t.trim() === "— — —" ? {pageBreak: true} : {text: t.replace(/\n/g, " ")})), st)}, "Word"),
    h("button", {class: "btn ghost small", type: "button", onclick: async () => saveFile(baseName(file.name) + "-texte.pdf", await blocksToPdf(area.value.split(/\n/).map(t => t.trim() === "— — —" ? {pageBreak: true} : {text: t})), st)}, "PDF texte seul"),
    h("button", {class: "btn ghost small", type: "button", onclick: () => saveFile(baseName(file.name) + "-texte.txt", area.value, st)}, "TXT"),
    copyBtn);
  body.append(
    h("div", {class: "row"},
      dropZone({accept: "image/*", capture: "environment", label: "Prendre une photo", hint: "ouvre l'appareil photo sur téléphone", sample: false, onFiles: fs => { file = fs[0]; go.disabled = false; setStatus(st, file.name); }}),
      dropZone({accept: "image/*,application/pdf,.pdf", label: "Choisir une image ou un PDF", hint: "30 pages au maximum", onFiles: fs => { file = fs[0]; go.disabled = false; setStatus(st, file.name); }})),
    fieldBox("Langue du document", seg([["fra+spa", "Français + espagnol"], ["fra", "Français"], ["spa", "Espagnol"], ["eng", "Anglais"]], lang, v => lang = v)),
    h("p", {class: "note"}, "Tout se passe sur ton appareil, sans envoyer le document à personne. La première lecture prend quelques secondes de plus, le temps de charger le moteur."),
    h("div", {class: "row"}, go), area, acts);
}

/* ---------- start ---------- */
if (!window.PDFLib || !window.pdfjsLib) {
  app.replaceChildren(h("p", {class: "status err"}, "Les outils n'ont pas pu se charger. Vérifie ta connexion puis recharge la page."));
} else route();
</script>
